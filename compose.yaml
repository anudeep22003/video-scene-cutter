services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: video_slicer
      POSTGRES_PASSWORD: video_slicer
      POSTGRES_DB: video_slicer
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
